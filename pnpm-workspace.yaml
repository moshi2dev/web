allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - cf
  - "@cloudflare/build-output-utils"
  - "@cloudflare/config"
  - "@cloudflare/runtime-types"
  - miniflare
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
